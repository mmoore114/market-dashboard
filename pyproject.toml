[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-dashboard"
version = "0.1.0"
description = "Equity discovery, ranking, and discretionary market research dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "streamlit",
    "boto3",
    "botocore",
    "fastapi==0.141.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

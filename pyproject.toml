[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-dashboard"
version = "0.1.0"
description = "Equity discovery, ranking, and discretionary market research dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

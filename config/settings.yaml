project:
  name: market-dashboard
data:
  raw_directory: data/raw
  processed_directory: data/processed
  database_directory: data/database
  duckdb_filename: market_dashboard.duckdb
ingestion:
  test_tickers:
    - SPY
    - QQQ
    - NVDA
    - AAPL
    - MSFT
  default_history_days: 400
  request_pause_seconds: 0.25
security_master:
  parquet_directory: data/processed/security_master
  reference_query:
    market: stocks
    locale: us
    active: true
    page_limit: 1000
  candidate_filters:
    locale: us
    active_only: true
    allowed_exchange_mics:
      - XNYS
      - XNAS
      - ARCX
      - XASE
      - BATS
    allowed_categories:
      - Common Stock
      - ETF
    # Provider type is an instrument-shape signal, not exposure truth.
    # Economic exposure is classified by config/exposure_policy.yaml.
    excluded_security_types: {}
    acquisition_vehicle_name_patterns:
      - acquisition corp
      - acquisition co
      - blank check
  exchange_mapping:
    XNYS: NYSE
    XNAS: Nasdaq
    ARCX: NYSE Arca
    XASE: NYSE American
    BATS: Cboe BZX
  security_type_mapping:
    CS: Common Stock
    ETF: ETF
    ETS: ETF
    ETV: Exchange Traded Vehicle
    PFD: Preferred Share
    WARRANT: Warrant
    RIGHT: Right
    UNIT: Unit
    ADRC: Depositary Receipt
    ADRP: Preferred Share
    GDR: Depositary Receipt
    FUND: Fund
    ETN: Exchange Traded Note
    SP: Structured Product
    OS: Other Security
    OTHER: Other Security
swing_universe:
  parquet_directory: data/processed/swing_universe
  exposure_policy_config: config/exposure_policy.yaml
  exposure_classification_directory: data/processed/exposure_classification
  recent_window_sessions: 90
  thresholds:
    minimum_latest_close: 5
    minimum_average_dollar_volume_20: 50000000
    minimum_valid_observations: 60
    minimum_session_coverage_percent: 90
adjusted_backfill:
  plan_parquet_directory: data/processed/adjusted_backfill_plans
  manifest_database: data/processed/manifests/adjusted_ingestion_manifest.duckdb
  planned_history_start: 2024-01-01
  request_pause_seconds: 0.25
  overlap_calendar_days: 0
  maximum_attempts: 4
  retry_backoff_seconds: 2
  retry_max_backoff_seconds: 60
  retry_jitter_ratio: 0.25
flat_files:
  endpoint_url: https://files.massive.com
  bucket: flatfiles
  stock_day_aggregate_prefix: us_stocks_sip/day_aggs_v1
  raw_directory: data/raw/massive_flat_files/stocks/day_aggs
  parquet_directory: data/processed/full_market_daily
  manifest_directory: data/processed/manifests
  default_start_date: 2023-06-14
  default_end_date: 2026-06-14
  max_download_attempts: 4
  retry_backoff_seconds: 2
  multipart_threshold_mb: 32
